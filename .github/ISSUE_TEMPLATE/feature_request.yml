name: ✨ Feature 请求
description: 提出新功能或改进建议
title: "[FEATURE] "
labels: [enhancement, "Triage Needed"]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: 功能概述
      description: 一句话说明要做什么
      placeholder: "例：支持按消费者查看 MCP 调用的用量视图"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 为什么需要这个功能？解决什么痛点？
      placeholder: "管理员现在只能逐个消费者查调用概览，缺少横向对比，排查异常消费者要翻多个页面"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 功能描述
      description: 详细描述功能行为、交互方式
      placeholder: |
        1. 用量页增加「按消费者」维度
        2. 支持按调用次数 / 失败率排序
        3. 点击某一行下钻到该消费者的调用明细
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有其他实现思路或替代方案
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 从项目角度评估
      options:
        - P0 紧急
        - P1 重要
        - P2 一般
        - P3 锦上添花
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 竞品截图、设计稿链接、相关 Issue/PR
    validations:
      required: false
